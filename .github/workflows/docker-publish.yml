name: Docker Publish


on:

  push:

    tags:

      - "v*"





jobs:


  frontend:


    runs-on: ubuntu-latest


    permissions:

      contents: read

      packages: write



    steps:


      - name: Checkout repository

        uses: actions/checkout@v4





      - name: Login GHCR

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}







      - name: Build and push frontend

        uses: docker/build-push-action@v6

        with:


          context: .


          file: ./Dockerfile


          push: true


          no-cache: true



          build-args: |

            VITE_API_URL=${{ secrets.VITE_API_URL }}

            VITE_EMAIL_SERVICE_ID=${{ secrets.VITE_EMAIL_SERVICE_ID }}

            VITE_EMAIL_TEMPLATE_ID=${{ secrets.VITE_EMAIL_TEMPLATE_ID }}

            VITE_EMAIL_PUBLIC_KEY=${{ secrets.VITE_EMAIL_PUBLIC_KEY }}

            VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}



          tags: |

            ghcr.io/andgelbrissaud/poussieredantan:latest

            ghcr.io/andgelbrissaud/poussieredantan:${{ github.ref_name }}









  backend:


    runs-on: ubuntu-latest


    permissions:

      contents: read

      packages: write



    steps:


      - name: Checkout repository

        uses: actions/checkout@v4





      - name: Login GHCR

        uses: docker/login-action@v3

        with:


          registry: ghcr.io


          username: ${{ github.actor }}


          password: ${{ secrets.GITHUB_TOKEN }}







      - name: Build and push backend


        uses: docker/build-push-action@v6


        with:


          context: ./backend


          file: ./backend/Dockerfile


          push: true


          no-cache: true


          tags: |

            ghcr.io/andgelbrissaud/poussieredantan-backend:latest

            ghcr.io/andgelbrissaud/poussieredantan-backend:${{ github.ref_name }}